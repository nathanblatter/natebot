name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        env:
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          cd /Users/nathanblatter/Desktop/natebot
          git pull origin main
          swift build -c release
          launchctl unload ~/Library/LaunchAgents/com.natebot.daemon.plist 2>/dev/null || true
          cp .build/release/natebot /Users/nathanblatter/.local/bin/natebot
          launchctl load ~/Library/LaunchAgents/com.natebot.daemon.plist
