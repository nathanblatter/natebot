name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy
        run: |
          # Scratch path outside the repo so checkout's git clean doesn't wipe
          # incremental build state between deploys.
          swift build -c release --scratch-path /Users/nathanblatter/.natebot-scratch
          # Brain workspace: persona/environment docs for the headless Claude
          # Code sessions the daemon spawns. Lives outside the repo checkout.
          mkdir -p /Users/nathanblatter/natebot-brain/.claude
          cp brain/CLAUDE.md /Users/nathanblatter/natebot-brain/CLAUDE.md
          cp brain/.mcp.json /Users/nathanblatter/natebot-brain/.mcp.json
          cp brain/.claude/settings.json /Users/nathanblatter/natebot-brain/.claude/settings.json
          launchctl unload ~/Library/LaunchAgents/com.natebot.daemon.plist 2>/dev/null || true
          # Replace by RENAME, never cp-over-in-place: cp reuses the inode and
          # the kernel's cached code signature for that vnode goes stale — the
          # next spawn dies instantly with OS_REASON_CODESIGNING (SIGKILL).
          cp /Users/nathanblatter/.natebot-scratch/release/natebot /Users/nathanblatter/.local/bin/natebot.new
          mv -f /Users/nathanblatter/.local/bin/natebot.new /Users/nathanblatter/.local/bin/natebot
          launchctl load ~/Library/LaunchAgents/com.natebot.daemon.plist
